<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<!-- 同步任务结果详情（表映射汇总） -->
<div class="form-container" id="mappingDetailPage" th:attr="data-mapping-id=${mappingId}">
    <div class="card-header">
        <h3 class="card-title text-center">同步结果详情</h3>
    </div>
    <div class="card-body">
        <div class="grid grid-cols-6 items-end mb-4">
            <div class="lg:col-span-2 form-item mb-0">
                <label class="form-label">状态</label>
                <select id="detailStatusFilter" class="form-control">
                    <option value="" th:selected="${detailStatus == null or detailStatus == ''}">全部</option>
                    <option value="success" th:selected="${detailStatus == 'success'}">成功</option>
                    <option value="fail" th:selected="${detailStatus == 'fail'}">失败</option>
                </select>
            </div>
            <div class="lg:col-span-4 flex items-center justify-end">
                <button type="button" class="btn btn-outline" onclick="backIndexPage()">
                    <i class="fa fa-reply"></i> 返回列表
                </button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th class="width50px"></th>
                <th>源表</th>
                <th>目标表</th>
                <th>成功数</th>
                <th>失败数</th>
                <th>更新时间</th>
                <th class="width80px">查看详情</th>
            </tr>
            </thead>
            <tbody id="detail-result-table"></tbody>
        </table>
        <div class="blank-block"></div>
    </div>
</div>

<script th:src="@{/js/mapping/mapping-detail.js}"></script>
</html>
