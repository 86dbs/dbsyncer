<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">告警通知</h3>
    </div>
    <div class="card-body">
        <p class="text-sm mb-4">
            <i class="fa fa-external-link text-info"></i>
            <a href="https://gitee.com/ghi/dbsyncer/wikis/%E6%93%8D%E4%BD%9C%E6%89%8B%E5%86%8C/%E5%91%8A%E8%AD%A6%E9%80%9A%E7%9F%A5?sort_id=17782458#%E4%BA%94-%E6%B6%88%E6%81%AF%E7%B1%BB%E5%9E%8B"
               title="点击查看规则"
               target='_blank'>
                查看规则
            </a>
        </p>
        <form id="notice-form-edit">
            <div class="form-actions mb-4 flex justify-end">
                <button id="testNoticeBtn" type="button" class="btn btn-default mr-2" data-permission="notice:edit"
                        th:if="${config?.wechat != null and (config?.wechat?.enabled || config?.dingTalk?.enabled || config?.http?.enabled || config?.mail?.enabled)}">
                    <span class="fa fa-flash"></span> 测试
                </button>
                <button id="updateNoticeBtn" type="button" class="btn btn-primary" data-permission="notice:edit">
                    <span class="fa fa-save"></span> 保存
                </button>
            </div>

            <div class="grid grid-cols-2 items-start">
                <div>
                    <h3 class="card-title">通知渠道</h3>
                    <p class="text-sm text-tertiary mb-4">配置全局 webhook；@ 请在下方「通知规则」中按任务/分组设置。</p>

                    <div class="grid grid-cols-1">
                        <div class="form-item">
                            <label class="form-label">企业微信</label>
                            <div class="form-control-area">
                                <label class="form-switch">
                                    <input name="enableWechat" type="checkbox" th:checked="${config?.wechat?.enabled}"/>
                                    <span class="switch-track">
                                    <span class="switch-option switch-option-on">Yes</span>
                                    <span class="switch-option switch-option-off">No</span>
                                    <span class="switch-thumb"></span>
                                </span>
                                </label>
                            </div>
                        </div>
                        <div class="form-item wechat-config hidden">
                            <label class="form-label">webhook<strong class="text-primary">*</strong></label>
                            <div class="form-control-area">
                            <textarea name="wechatWebhookUrl" required class="form-control" maxlength="200" rows="3"
                                      placeholder="企业微信机器人webhook地址">[[${config?.wechat?.webhookUrl}]]</textarea>
                            </div>
                        </div>

                        <div class="form-item">
                            <label class="form-label">钉钉</label>
                            <div class="form-control-area">
                                <label class="form-switch">
                                    <input name="enableDingTalk" type="checkbox"
                                           th:checked="${config?.dingTalk?.enabled}"/>
                                    <span class="switch-track">
                                    <span class="switch-option switch-option-on">Yes</span>
                                    <span class="switch-option switch-option-off">No</span>
                                    <span class="switch-thumb"></span>
                                </span>
                                </label>
                            </div>
                        </div>
                        <div class="form-item dingtalk-config hidden">
                            <label class="form-label">webhook<strong class="text-primary">*</strong></label>
                            <div class="form-control-area">
                            <textarea name="dingTalkWebhookUrl" required class="form-control" maxlength="200" rows="3"
                                      placeholder="钉钉机器人webhook地址">[[${config?.dingTalk?.webhookUrl}]]</textarea>
                            </div>
                        </div>

                        <div class="form-item">
                            <label class="form-label">HTTP</label>
                            <div class="form-control-area">
                                <label class="form-switch">
                                    <input name="enableHttp" type="checkbox" th:checked="${config?.http?.enabled}"/>
                                    <span class="switch-track">
                                    <span class="switch-option switch-option-on">Yes</span>
                                    <span class="switch-option switch-option-off">No</span>
                                    <span class="switch-thumb"></span>
                                </span>
                                </label>
                            </div>
                        </div>
                        <div class="form-item http-config hidden">
                            <label class="form-label">url<strong class="text-primary">*</strong></label>
                            <div class="form-control-area">
                            <textarea name="httpUrl" required class="form-control" maxlength="200" rows="3"
                                      placeholder="回调http地址">[[${config?.http?.url}]]</textarea>
                            </div>
                        </div>

                        <div class="form-item">
                            <label class="form-label">邮件</label>
                            <div class="form-control-area">
                                <label class="form-switch">
                                    <input name="enableMail" type="checkbox" th:checked="${config?.mail?.enabled}"/>
                                    <span class="switch-track">
                                    <span class="switch-option switch-option-on">Yes</span>
                                    <span class="switch-option switch-option-off">No</span>
                                    <span class="switch-thumb"></span>
                                </span>
                                </label>
                            </div>
                        </div>
                        <div class="form-item mail-config hidden">
                            <label class="form-label">账号<strong class="text-primary">*</strong></label>
                            <div class="form-control-area">
                                <input type="text" class="form-control" maxlength="100" name="mailAccount" required
                                       th:value="${config?.mail?.account}"/>
                            </div>
                        </div>
                        <div class="form-item mail-config hidden">
                            <label class="form-label">Code<strong class="text-primary">*</strong><i
                                    class="fa fa-question-circle"
                                    title="发邮件的Code,不是邮箱密码，示例：wqoxxxxxxdflbbig"></i></label>
                            <div class="form-control-area">
                                <input type="text" class="form-control" maxlength="100" name="mailCode" required
                                       th:value="${config?.mail?.code}"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="card-title">告警策略</h3>
                    <p class="text-sm text-tertiary mb-4">启用状态切换后即时生效。</p>
                    <table class="table" id="strategyTable">
                        <thead>
                        <tr>
                            <th>名称</th>
                            <th>说明</th>
                            <th>启用</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="blank-block-min"></div>
            <h3 class="card-title mt-6">通知规则</h3>
            <p class="text-sm text-tertiary mb-4">按分组或同步任务覆盖 @手机号与邮件（支持多人）；任务规则优先于分组规则。增删改即时生效，无需点上方保存。</p>
            <div class="form-actions mb-2">
                <button type="button" class="btn btn-default" id="addRuleBtn" data-permission="notice:edit">
                    <i class="fa fa-plus"></i> 添加规则
                </button>
            </div>
            <table class="table" id="ruleTable">
                <thead>
                <tr>
                    <th>作用域</th>
                    <th>目标</th>
                    <th>@所有人</th>
                    <th>@手机号</th>
                    <th>邮件</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </form>
        <div class="blank-block-md"></div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const initialStrategies = /*[[${strategies}]]*/ [];
    const initialNoticeRules = /*[[${noticeRules}]]*/ [];
    const groupOptions = /*[[${groups}]]*/ [];
    const mappingOptions = /*[[${mappings}]]*/ [];
    /*]]>*/

    $(function () {
        let strategies = Array.isArray(initialStrategies) ? JSON.parse(JSON.stringify(initialStrategies)) : [];
        let noticeRules = Array.isArray(initialNoticeRules) ? JSON.parse(JSON.stringify(initialNoticeRules)) : [];
        const canEditStrategy = !window.DBSPermission || DBSPermission.has('notice:edit');
        const FREQUENCY_INTERVAL = 1;

        function toggleConfigItems(checked, items) {
            if (checked) {
                items.removeClass('hidden');
            } else {
                items.addClass('hidden');
            }
        }

        function initSwitchToggle(switchName, config) {
            const switchElement = $('input[name="' + switchName + '"]');
            let switchApi = initSwitch(switchElement, function (checked) {
                toggleConfigItems(checked, config);
            });
            toggleConfigItems(switchApi.isChecked(), config);
        }

        initSwitchToggle('enableMail', $('.mail-config'));
        initSwitchToggle('enableHttp', $('.http-config'));
        initSwitchToggle('enableWechat', $('.wechat-config'));
        initSwitchToggle('enableDingTalk', $('.dingtalk-config'));
        initMultipleInputTags();

        function groupName(id) {
            const hit = (groupOptions || []).find(function (g) {
                return g.id === id;
            });
            return hit ? hit.name : id;
        }

        function mappingName(id) {
            const hit = (mappingOptions || []).find(function (m) {
                return m.id === id;
            });
            return hit ? hit.name : id;
        }

        function switchEnabled(s, checked, $input) {
            const prev = !checked;
            doPoster('/notice/strategy/save', {
                id: s.id || '',
                name: s.name || '',
                frequency: s.frequency,
                cron: Number(s.frequency) === FREQUENCY_INTERVAL ? (s.cron || '') : '',
                enabled: checked ? 'true' : 'false',
                noticeTypes: s.noticeTypes,
                remark: s.remark || ''
            }, function (response) {
                if (response.success === true) {
                    s.enabled = checked;
                    bootGrowl(checked ? '已启用' : '已停用', 'success');
                } else {
                    $input.prop('checked', prev);
                    $input.attr('aria-checked', prev);
                    bootGrowl(response.message || '操作失败', 'danger');
                }
            });
        }

        function renderStrategies() {
            const $tbody = $('#strategyTable tbody').empty();
            if (!strategies.length) {
                $tbody.append('<tr><td colspan="3" class="text-center text-tertiary py-8">暂无策略</td></tr>');
                return;
            }
            strategies.forEach(function (s) {
                const checked = s.enabled !== false;
                const $tr = $('<tr></tr>');
                $tr.append($('<td></td>').text(s.name || ''));
                $tr.append($('<td></td>').text(s.remark || ''));

                const $input = $('<input type="checkbox" class="strategy-enabled-switch"/>')
                    .prop('checked', checked)
                    .prop('disabled', !canEditStrategy || !s.id);
                const $switch = $('<label class="form-switch"></label>').append($input)
                    .append($('<span class="switch-track"></span>')
                        .append('<span class="switch-option switch-option-on">Yes</span>')
                        .append('<span class="switch-option switch-option-off">No</span>')
                        .append('<span class="switch-thumb"></span>'));
                $tr.append($('<td></td>').append($switch));
                $tbody.append($tr);

                if (canEditStrategy && s.id) {
                    initSwitch($input, function (checkedVal) {
                        switchEnabled(s, checkedVal, $input);
                    });
                }
            });
        }

        function renderRules() {
            const $tbody = $('#ruleTable tbody').empty();
            if (!noticeRules.length) {
                $tbody.append('<tr><td colspan="6" class="text-center text-tertiary py-8">暂无通知规则</td></tr>');
                return;
            }
            noticeRules.forEach(function (r, index) {
                const scopeLabel = r.scopeType === 'group' ? '分组' : '同步任务';
                const target = r.scopeType === 'group' ? groupName(r.scopeId) : mappingName(r.scopeId);
                const $tr = $('<tr></tr>');
                $tr.append($('<td></td>').text(scopeLabel));
                $tr.append($('<td></td>').text(target || ''));
                $tr.append($('<td></td>').text(r.atAll == 1 || r.atAll === true ? '是' : '否'));
                $tr.append($('<td></td>').text(r.atPhones || ''));
                $tr.append($('<td></td>').text(r.emails || ''));
                const $ops = $('<td></td>');
                $ops.append($('<button type="button" class="table-action-btn" title="编辑"><i class="fa fa-edit"></i></button>')
                    .on('click', function () {
                        editRule(index);
                    }));
                $ops.append($('<button type="button" class="table-action-btn delete" title="删除"><i class="fa fa-trash"></i></button>')
                    .on('click', function () {
                        if (!r.id) {
                            noticeRules.splice(index, 1);
                            renderRules();
                            return;
                        }
                        doPoster('/notice/rule/remove', {id: r.id}, function (response) {
                            if (response.success === true) {
                                bootGrowl('已删除', 'success');
                                noticeRules.splice(index, 1);
                                renderRules();
                            } else {
                                bootGrowl(response.message, 'danger');
                            }
                        });
                    }));
                $tr.append($ops);
                $tbody.append($tr);
            });
        }

        function escapeAttr(text) {
            return String(text == null ? '' : text).replace(/"/g, '&quot;');
        }

        function editRule(index) {
            const isNew = index < 0;
            const r = isNew ? {id: '', scopeType: 'mapping', scopeId: '', atAll: 0, atPhones: '', emails: ''}
                : JSON.parse(JSON.stringify(noticeRules[index]));
            const atAllChecked = r.atAll == 1 || r.atAll === true;
            const bodyHtml = '<div class="group-dialog-body">'
                + '<div class="form-item"><label class="form-label">作用域<strong class="text-primary">*</strong></label>'
                + '<div class="form-control-area"><select class="form-control" id="mScopeType"></select></div></div>'
                + '<div class="form-item mt-4" id="mMappingWrap"><label class="form-label">同步任务<strong class="text-primary">*</strong></label>'
                + '<div class="form-control-area"><select class="form-control" id="mMappingId"></select></div></div>'
                + '<div class="form-item mt-4" id="mGroupWrap"><label class="form-label">分组<strong class="text-primary">*</strong></label>'
                + '<div class="form-control-area"><select class="form-control" id="mGroupId"></select></div></div>'
                + '<div class="form-item mt-4"><label class="form-label">@所有人</label><div class="form-control-area">'
                + '<label class="form-switch"><input id="mAtAll" type="checkbox"' + (atAllChecked ? ' checked' : '') + '/>'
                + '<span class="switch-track"><span class="switch-option switch-option-on">Yes</span>'
                + '<span class="switch-option switch-option-off">No</span><span class="switch-thumb"></span></span></label></div></div>'
                + '<div class="form-item mt-4"><label class="form-label">@手机号</label><div class="form-control-area">'
                + '<input class="form-control" id="mAtPhones" maxlength="512" data-role="tagsinput" placeholder="多个手机号"'
                + ' value="' + escapeAttr(r.atPhones) + '"/></div></div>'
                + '<div class="form-item mt-4"><label class="form-label">邮件</label><div class="form-control-area">'
                + '<input class="form-control" id="mEmails" maxlength="512" data-role="tagsinput" placeholder="多个邮箱"'
                + ' value="' + escapeAttr(r.emails) + '"/></div></div>'
                + '<div class="blank-block-md"></div></div>';

            let scopeSelect = null;
            let mappingSelect = null;
            let groupSelect = null;
            const modal = showConfirm({
                title: isNew ? '添加通知规则' : '编辑通知规则',
                body: bodyHtml,
                size: 'xlarge',
                position: 'center',
                closeOnConfirm: false,
                onConfirm: function () {
                    const $dialog = $(modal.getDialog());
                    const scopeType = (scopeSelect && scopeSelect.getValues()[0]) || 'mapping';
                    const scopeId = scopeType === 'group'
                        ? ((groupSelect && groupSelect.getValues()[0]) || '')
                        : ((mappingSelect && mappingSelect.getValues()[0]) || '');
                    const atAll = $dialog.find('#mAtAll').is(':checked');
                    const atPhones = $dialog.find('#mAtPhones').val() || '';
                    const emails = $dialog.find('#mEmails').val() || '';
                    if (!scopeId) {
                        bootGrowl('请选择分组或同步任务', 'danger');
                        return;
                    }
                    if (!atAll && !$.trim(atPhones) && !$.trim(emails)) {
                        bootGrowl('未开启@所有人时须填写手机号或邮件', 'danger');
                        return;
                    }
                    const dup = noticeRules.some(function (item, i) {
                        return i !== index && item.scopeType === scopeType && item.scopeId === scopeId;
                    });
                    if (dup) {
                        bootGrowl('同一分组/任务只能配置一条规则', 'danger');
                        return;
                    }
                    doPoster('/notice/rule/save', {
                        id: r.id || '',
                        scopeType: scopeType,
                        scopeId: scopeId,
                        atAll: atAll ? 'true' : 'false',
                        atPhones: atPhones,
                        emails: emails
                    }, function (response) {
                        if (response.success === true) {
                            bootGrowl(isNew ? '添加成功' : '修改成功', 'success');
                            modal.close();
                            doLoader('/notice');
                        } else {
                            bootGrowl(response.message, 'danger');
                        }
                    });
                }
            });
            setTimeout(function () {
                const $dialog = $(modal.getDialog());
                initSwitch($dialog.find('#mAtAll'), function () {
                });

                function toggleScope(scopeType) {
                    if (scopeType === 'group') {
                        $dialog.find('#mGroupWrap').show();
                        $dialog.find('#mMappingWrap').hide();
                    } else {
                        $dialog.find('#mGroupWrap').hide();
                        $dialog.find('#mMappingWrap').show();
                    }
                }

                const scopeType = r.scopeType || 'mapping';
                scopeSelect = $dialog.find('#mScopeType').dbSelect({
                    type: 'single',
                    data: [
                        {label: '同步任务', value: 'mapping'},
                        {label: '分组', value: 'group'}
                    ],
                    defaultValue: [scopeType],
                    onSelect: function (values) {
                        toggleScope((values && values[0]) || 'mapping');
                    }
                });
                const mappingData = (mappingOptions || []).map(function (m) {
                    return {label: m.name || m.id, value: m.id};
                });
                const groupData = (groupOptions || []).map(function (g) {
                    return {label: g.name || g.id, value: g.id};
                });
                mappingSelect = $dialog.find('#mMappingId').dbSelect({
                    type: 'single',
                    data: mappingData,
                    defaultValue: scopeType === 'mapping' && r.scopeId ? [r.scopeId] : []
                });
                groupSelect = $dialog.find('#mGroupId').dbSelect({
                    type: 'single',
                    data: groupData,
                    defaultValue: scopeType === 'group' && r.scopeId ? [r.scopeId] : []
                });
                toggleScope(scopeType);
                if (typeof initMultipleInputTags === 'function') {
                    initMultipleInputTags();
                }
            }, 0);
        }

        $('#addRuleBtn').on('click', function () {
            editRule(-1);
        });

        renderStrategies();
        renderRules();

        $("#updateNoticeBtn").click(function () {
            const $form = $("#notice-form-edit");
            if (validateForm($form)) {
                const submitBtn = $(this);
                const originalText = submitBtn.html();
                submitBtn.html('<i class="fa fa-spinner fa-spin"></i> 保存中...').prop('disabled', true);
                doPoster('/notice/edit', $form.serializeJson(), function (response) {
                    submitBtn.html(originalText).prop('disabled', false);
                    if (response.success === true) {
                        bootGrowl("修改成功!", "success");
                        doLoader("/notice");
                    } else {
                        bootGrowl(response.message, "danger");
                    }
                });
            }
        });

        $("#testNoticeBtn").click(function () {
            const submitBtn = $(this);
            const originalText = submitBtn.html();
            submitBtn.html('<i class="fa fa-spinner fa-spin"></i> 测试中...').prop('disabled', true);
            doPoster('/notice/test', {}, function (response) {
                submitBtn.html(originalText).prop('disabled', false);
                if (response.success === true) {
                    bootGrowl("测试成功!", "success");
                    doLoader("/notice");
                } else {
                    bootGrowl(response.message, "danger");
                }
            });
        });
    });
</script>
</html>
