<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">集群管理</h3>
    </div>
    <div class="card-body">
        <div class="grid grid-cols-6 items-center mb-4">
            <div class="lg:col-span-4">
                <span th:if="${clusterEnabled}">
                    当前节点：<strong th:text="${current.id}">-</strong>
                    ，角色：<strong th:text="${current.roleName}">-</strong>
                    <span th:unless="${current.leader}">
                        <span th:if="${current.leaderHttpUrl}">
                            ，请到 Leader 操作：<a class="text-primary hover-underline" th:href="${current.leaderHttpUrl}" th:text="${current.leaderHttpUrl}">-</a>
                        </span>
                    </span>
                </span>
                <span th:unless="${clusterEnabled}">当前为单机模式。集群为商业版能力，需授权产品码 ClusterService，配置 dbsyncer.cluster.enabled=true 且使用 MySQL 存储。</span>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>节点</th>
                <th>HTTP</th>
                <th>Raft</th>
                <th>角色</th>
                <th>状态</th>
                <th>网络</th>
                <th>心跳</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="clusterTableBody"></tbody>
        </table>
        <div class="blank-block"></div>
    </div>
</div>

<script th:inline="javascript">
    const clusterEnabled = [[${clusterEnabled}]];
    const currentIsLeader = [[${current.leader}]];

    function renderClusterRow(item) {
        const networkText = item.networkOk ? '通' : '不通';
        const localMark = item.local ? ' (本机)' : '';
        const heartbeat = item.lastHeartbeatTime ? formatDate(item.lastHeartbeatTime) : '-';
        let actions = '-';
        if (clusterEnabled && currentIsLeader && !item.local) {
            const nodeId = escapeHtml(item.id || '');
            const removeBtn = `<button type="button" class="table-action-btn delete" title="移除" data-id="${nodeId}" data-action="remove">
                    <i class="fa fa-trash"></i>
                </button>`;
            if (item.status === 1 && !item.leader) {
                actions = `<div class="flex items-center">
                <button type="button" class="table-action-btn view" title="切换为Leader" data-id="${nodeId}" data-action="transfer">
                    <i class="fa fa-flag"></i>
                </button>
                ${removeBtn}
            </div>`;
            } else {
                actions = `<div class="flex items-center">${removeBtn}</div>`;
            }
        }
        return `<tr>
            <td>${escapeHtml(item.id || '')}${localMark}</td>
            <td>${escapeHtml(item.ip || '')}:${item.httpPort || ''}</td>
            <td>${item.raftPort || ''}</td>
            <td>${escapeHtml(item.roleName || '')}</td>
            <td>${escapeHtml(item.statusName || '')}</td>
            <td>${networkText}</td>
            <td>${heartbeat}</td>
            <td>${actions}</td>
        </tr>`;
    }

    function transferNode(id) {
        showConfirm({
            title: '确定将该节点切换为 Leader？',
            icon: 'warning',
            onConfirm: function () {
                doPoster('/cluster/transfer', {id: id}, function (res) {
                    if (res.success === true) {
                        bootGrowl('已发起切换', 'success');
                        doLoader('/cluster/list');
                    } else {
                        bootGrowl(res.message || '切换失败', 'danger');
                    }
                });
            }
        });
    }

    function removeClusterNode(id) {
        showConfirm({
            title: '确定移除该节点？',
            icon: 'warning',
            confirmType: 'danger',
            onConfirm: function () {
                doPoster('/cluster/remove', {id: id}, function (res) {
                    if (res.success === true) {
                        bootGrowl('已移除', 'success');
                        doLoader('/cluster/list');
                    } else {
                        bootGrowl(res.message || '移除失败', 'danger');
                    }
                });
            }
        });
    }

    $(document).ready(function () {
        window.backIndexPage = function () {
            doLoader('/cluster/list');
        };
        $('#clusterTableBody').on('click', '.table-action-btn', function () {
            const $btn = $(this);
            const id = $btn.attr('data-id');
            const action = $btn.attr('data-action');
            if (action === 'transfer') {
                transferNode(id);
                return;
            }
            if (action === 'remove') {
                removeClusterNode(id);
            }
        });
        new PaginationManager({
            requestUrl: '/cluster/query',
            tableBodySelector: '#clusterTableBody',
            renderRow: renderClusterRow,
            storageKey: 'cluster-list'
        });
    });
</script>
</html>
