<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<!-- 社区版提示 -->
<div th:if="${editionInfo.edition eq 'community'}" class="text-center">
    <h3 class="text-xl text-center text-gray-500">[[${editionInfo.editionName}]]</h3>
    <div class="bg-info/10 border border-info rounded-lg p-4 mb-6 text-left">
        <h4 class="text-lg font-semibold text-info mb-2">
            <i class="fa fa-server"></i> 什么是 Agent？
        </h4>
        <p class="text-sm text-secondary mb-3">
            Agent 负责在源端采集变更日志，并由平台侧的采集任务接收后推送给同步任务。适合源库与同步平台分离部署的场景。
        </p>
    </div>
    <p class="text-secondary mb-6">
        该功能仅在专业版开放，请下载
        <a href="https://gitee.com/ghi/dbsyncer/releases"
           class="text-primary hover-underline font-medium"
           title="下载专业版"
           target="_blank">
            <i class="fa fa-download"></i> 专业版
        </a>
    </p>
</div>

<!-- 专业版内容 -->
<div th:if="${editionInfo.edition ne 'community'}" class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Agent 管理</h3>
    </div>
    <div class="card-body">
        <div class="mb-4 text-sm text-secondary" th:unless="${agentAvailable}">
            当前环境未启用 Agent 能力，请确认已使用专业版并完成授权。
        </div>

        <div th:if="${agentAvailable}" class="flex items-center justify-between gap-2 mb-4">
            <div></div>
            <button class="btn btn-primary" type="button" data-permission="agent:edit"
                    onclick="doLoader('/agent/page/add')">
                <i class="fa fa-plus"></i> 添加
            </button>
        </div>

        <table th:if="${agentAvailable}" class="table">
            <thead>
            <tr>
                <th></th>
                <th>名称</th>
                <th>监听端口</th>
                <th>状态</th>
                <th>更新时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="agentTableBody"></tbody>
        </table>
        <div th:if="${agentAvailable}" class="blank-block"></div>
    </div>
</div>

<script th:if="${editionInfo.edition ne 'community' and agentAvailable}"
        th:src="@{/js/agent/agent-list.js}"></script>
</html>
