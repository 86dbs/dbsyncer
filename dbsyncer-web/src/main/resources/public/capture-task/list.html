<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<!-- 社区版提示 -->
<div th:if="${editionInfo.edition eq 'community'}" class="text-center">
    <h3 class="text-xl text-center text-gray-500">[[${editionInfo.editionName}]]</h3>
    <div class="bg-info/10 border border-info rounded-lg p-4 mb-6 text-left">
        <h4 class="text-lg font-semibold text-info mb-2">
            <i class="fa fa-server"></i> 什么是采集任务？
        </h4>
        <p class="text-sm text-secondary mb-3">
            采集任务支持本地采集（本机采源库日志）与远端采集（连接本地采集收事件），适合源库与同步平台分离部署的场景。
        </p>
    </div>
    <p class="text-secondary mb-6">
        该功能仅在专业版开放，请下载
        <a href="https://gitee.com/ghi/dbsyncer/releases"
           class="text-primary hover-underline font-medium"
           title="下载专业版"
           target="_blank">
            <i class="fa fa-download"></i> 专业版
        </a>
    </p>
</div>

<!-- 专业版内容 -->
<div th:if="${editionInfo.edition ne 'community'}" class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">采集任务</h3>
    </div>
    <div class="card-body">
        <div class="mb-4 text-sm text-secondary" th:unless="${captureAvailable}">
            当前环境未启用采集能力，请确认已使用专业版并完成授权。
        </div>

        <div th:if="${captureAvailable}" class="flex items-center justify-between gap-2 mb-4">
            <div></div>
            <div class="flex items-center gap-2">
                <button class="btn btn-outline" type="button" data-permission="capture:edit"
                        onclick="doLoader('/capture-task/page/add?type=captureLocal')">
                    <i class="fa fa-plus"></i> 本地采集
                </button>
                <button class="btn btn-primary" type="button" data-permission="capture:edit"
                        onclick="doLoader('/capture-task/page/add?type=captureRemote')">
                    <i class="fa fa-plus"></i> 远端采集
                </button>
            </div>
        </div>

        <table th:if="${captureAvailable}" class="table">
            <thead>
            <tr>
                <th></th>
                <th>名称</th>
                <th>类型</th>
                <th>状态</th>
                <th>更新时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="captureTaskTableBody"></tbody>
        </table>
        <div th:if="${captureAvailable}" class="blank-block"></div>
    </div>
</div>

<script th:if="${editionInfo.edition ne 'community' and captureAvailable}"
        th:src="@{/js/capture-task/capture-task-list.js}"></script>
</html>
