<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">操作日志</h3>
    </div>
    <div class="card-body">
        <div class="form-filter">
            <div class="form-item">
                <label class="form-label" for="filterKeyword">关键字</label>
                <div class="form-control-area">
                    <input id="filterKeyword" type="text" class="form-control" maxlength="100" placeholder="操作信息"/>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterUsername">账号</label>
                <div class="form-control-area">
                    <input id="filterUsername" type="text" class="form-control" maxlength="50" placeholder="操作人"/>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterIp">IP</label>
                <div class="form-control-area">
                    <input id="filterIp" type="text" class="form-control" maxlength="64" placeholder="操作地址"/>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterModule">模块</label>
                <div class="form-control-area min-w-300">
                    <select id="filterModule" class="form-control">
                        <option value="" selected>全部</option>
                        <option th:each="m : ${logModules}" th:value="${m}" th:text="${m}"></option>
                    </select>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterStatus">状态</label>
                <div class="form-control-area">
                    <select id="filterStatus" class="form-control">
                        <option value="-1" selected>全部</option>
                        <option value="1">成功</option>
                        <option value="0">失败</option>
                    </select>
                </div>
            </div>
            <div class="form-item form-item-time">
                <label class="form-label" for="filterBeginTime">开始时间</label>
                <div class="form-control-area">
                    <input id="filterBeginTime" type="date" class="form-control"/>
                </div>
            </div>
            <div class="form-item form-item-time">
                <label class="form-label" for="filterEndTime">结束时间</label>
                <div class="form-control-area">
                    <input id="filterEndTime" type="date" class="form-control"/>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" id="searchBtn" class="btn btn-primary">
                    <i class="fa fa-search"></i> 查询
                </button>
                <button type="button" id="resetBtn" class="btn btn-outline">重置</button>
                <button type="button" id="clearBtn" class="btn btn-outline" data-permission="system:edit">清空日志</button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>模块</th>
                <th>操作信息</th>
                <th>操作人</th>
                <th>IP</th>
                <th>状态</th>
                <th>时间</th>
                <th>详细</th>
            </tr>
            </thead>
            <tbody id="operLogList"></tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/log/oper.js}"></script>
</html>
