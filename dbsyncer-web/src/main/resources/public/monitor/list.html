<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<!-- 图表和任务列表 -->
<div class="grid grid-cols-1 lg:grid-cols-3 mb-5">
    <!-- 左侧：TPS / CPU / 内存 -->
    <div class="lg:col-span-2">
        <div class="card mb-6">
            <div class="card-header">
                <h3 class="card-title text-center" id="tps">执行器TPS</h3>
            </div>
            <div class="card-body">
                <canvas id="tpsChart" height="200"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title text-center">CPU(%)</h3>
                </div>
                <div class="card-body">
                    <canvas id="cpuChart" height="200"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title text-center">内存(MB)</h3>
                </div>
                <div class="card-body">
                    <canvas id="memoryChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：系统状态 -->
    <div class="container-no-bg">
        <!-- CPU使用率 -->
        <div class="progress-card mb-3" id="cpuProgressBar"></div>

        <!-- 内存使用率 -->
        <div class="progress-card mb-3" id="memoryProgressBar"></div>

        <!-- 磁盘使用率 -->
        <div class="progress-card mb-3" id="diskProgressBar"></div>

        <!-- 应用状态 -->
        <div class="mb-3">
            <table class="table">
                <tbody id="metrics"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="grid grid-cols-2 mb-5">
    <!-- 查询执行器任务 -->
    <div class="form-container">
        <div class="card-header">
            <div class="grid grid-cols-6 items-center">
                <div class="lg:col-span-3">
                    <select id="searchActuatorMeta" class="form-control"></select>
                </div>
                <!-- 社区版按表名搜索；商业版为固定管道(channel)，不展示表名搜索 -->
                <div th:if="${editionInfo == null or editionInfo.edition eq 'community'}"
                     id="searchActuator" class="lg:col-span-3 search-wrapper">
                    <i class="fa fa-search search-icon"></i>
                    <input class="search-input" type="text" maxlength="32" placeholder="搜索表关键字" />
                    <span class="search-clear" title="清除">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th></th>
                    <th>同步任务</th>
                    <th>结果</th>
                </tr>
                </thead>
                <tbody id="actuatorList"></tbody>
            </table>
        </div>
    </div>

    <!-- 堆积 / 持久化趋势 -->
    <div class="grid grid-cols-1">
        <div class="form-container">
            <div class="card-header">
                <h3 class="card-title text-center">堆积趋势图</h3>
            </div>
            <div class="card-body">
                <canvas id="queueChart" height="160"></canvas>
            </div>
        </div>
        <div class="form-container">
            <div class="card-header">
                <h3 class="card-title text-center">持久化趋势图</h3>
            </div>
            <div class="card-body">
                <canvas id="storageChart" height="160"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/monitor/monitor.js}"></script>
</html>
